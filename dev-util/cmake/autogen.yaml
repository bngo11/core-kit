cmake_rule:
  generator: github-1
  packages:
    - cmake:
        desc: Cross platform Make
        homepage: https://cmake.org/
        tarball: cmake-{version}.tar.gz
        patches:
          # Prefix
          - 3.27.0_rc1-0001-Don-t-use-.so-for-modules-on-darwin-macos.-Use-.bund.patch
          - 3.27.0_rc1-0002-Set-some-proper-paths-to-make-cmake-find-our-tools.patch
          # Misc
          - 3.27.0_rc1-0003-Prefer-pkgconfig-in-FindBLAS.patch
          - 3.27.0_rc1-0004-Ensure-that-the-correct-version-of-Qt-is-always-used.patch
          - 3.27.0_rc1-0005-Respect-Gentoo-s-Python-eclasses.patch
          # cuda
          - 3.30.3-cudahostld.patch
          - 4.1.1-curl-8.16.0.patch
        github:
          user: Kitware
          repo: CMake
          query: releases
